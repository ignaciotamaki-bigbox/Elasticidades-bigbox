<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elasticidades · LatAm Performance</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;600&display=swap');

:root{
  --bg:#eef0f3; --panel:#ffffff; --panel-head:#f6f7f9; --panel-hover:#f0f2f5;
  --topbar:#ffffff; --varbar:#f6f7f9; --seg-on:#e5e8ec; --input:#ffffff; --grp:#f0f2f5;
  --border:rgba(0,0,0,0.10); --border-2:rgba(0,0,0,0.16);
  --text:#1f2430; --text-2:#5a6072; --faint:#9097a5;
  --green:#16a34a; --red:#e11d48; --blue:#2563eb;
  --c-spend:#d97706; --c-purch:#2563eb; --c-ses:#7c3aed; --c-money:#ea580c; --c-pct:#0891b2;
  --band-base:rgba(0,0,0,0.045); --band-actual:rgba(22,163,74,0.13);
  --divider:rgba(0,0,0,0.22); --grid:rgba(0,0,0,0.08); --tick:#64748b;
  --tooltip-bg:#ffffff; --tooltip-tx:#1f2430;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{ font-family:'Inter',-apple-system,sans-serif; background:var(--bg); color:var(--text);
  -webkit-font-smoothing:antialiased; font-size:13px; }
.mono{ font-family:'Roboto Mono',monospace; font-variant-numeric:tabular-nums; }

/* TOP BAR */
.topbar{ display:flex; align-items:center; height:42px; padding:0 14px;
  background:var(--topbar); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:50; }
.tb-left{ display:flex; align-items:center; gap:9px; }
.tb-icon{ color:var(--text-2); font-size:15px; }
.tb-title{ font-size:14px; font-weight:600; }
.tb-crumb{ font-size:13px; color:var(--text-2); }
.tb-right{ margin-left:auto; display:flex; align-items:center; gap:8px; }
.tb-btn{ width:30px; height:28px; border:1px solid var(--border-2); background:var(--panel);
  color:var(--text-2); border-radius:2px; cursor:pointer; font-size:14px; font-family:inherit;
  display:inline-flex; align-items:center; justify-content:center; }
.tb-btn:hover{ background:var(--panel-hover); color:var(--text); }
.tb-range{ display:inline-flex; align-items:center; gap:7px; font-size:12px; color:var(--text);
  border:1px solid var(--border-2); background:var(--panel); border-radius:2px; padding:5px 10px; }
.tb-range::before{ content:"🕑"; font-size:11px; filter:grayscale(1) opacity(0.6); }
.tb-time{ font-size:12px; color:var(--text-2); }

/* VARIABLE BAR */
.varbar{ display:flex; align-items:center; gap:16px; padding:9px 14px; background:var(--varbar);
  border-bottom:1px solid var(--border); position:sticky; top:42px; z-index:49; flex-wrap:wrap; }
.var{ display:flex; align-items:stretch; }
.var-l{ display:flex; align-items:center; font-size:12px; color:var(--text-2); background:var(--panel); border:1px solid var(--border-2);
  border-right:none; border-radius:2px 0 0 2px; padding:5px 9px; font-weight:500; white-space:nowrap; }
.seg{ display:inline-flex; border:1px solid var(--border-2); border-radius:0 2px 2px 0; overflow:hidden; }
.seg button{ font-family:inherit; font-size:12px; font-weight:500; color:var(--text-2);
  background:var(--panel); border:none; border-left:1px solid var(--border); padding:5px 11px; cursor:pointer; white-space:nowrap; }
.seg button:first-child{ border-left:none; }
.seg button:hover{ background:var(--panel-hover); color:var(--text); }
.seg button.on{ background:var(--seg-on); color:var(--text); box-shadow:inset 0 -2px 0 var(--blue); }
.bdot{ display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; vertical-align:middle; }
.seg button.on .bdot{ box-shadow:0 0 0 2px rgba(255,255,255,0.10); }
.wk-wrap{ display:inline-flex; align-items:center; gap:6px; border:1px solid var(--border-2);
  border-left:none; border-radius:0 2px 2px 0; padding:2px 8px; background:var(--panel); }
.wk-sel{ font-family:'Roboto Mono',monospace; font-size:12px; color:var(--text); background:var(--input);
  border:1px solid var(--border-2); border-radius:2px; padding:3px 6px; cursor:pointer; }
.wk-arrow{ color:var(--faint); font-size:12px; }
.varspacer{ flex:1; }
.win{ font-size:12px; color:var(--text-2); display:flex; align-items:center; gap:6px; }
.win b{ color:var(--text); font-weight:600; font-family:'Roboto Mono',monospace; }
.win-dot{ width:9px; height:9px; border-radius:2px; }
.win-dot.base{ background:rgba(204,204,220,0.4); }
.win-dot.actual{ background:var(--green); }

/* LAYOUT */
.wrap{ padding:10px 14px 60px; display:flex; flex-direction:column; gap:4px; }

/* RATIO ROW */
.ratio-row{ margin-bottom:11px; }
.ratio-head{ display:flex; align-items:center; gap:11px; padding:9px 2px; border-bottom:1px solid var(--border); margin-bottom:9px; }
.ratio-name{ font-size:15px; font-weight:700; letter-spacing:-0.2px; }
.ratio-formula{ font-size:12px; color:var(--text-2); }
.ratio-kpi-group{ margin-left:auto; display:flex; align-items:center; gap:9px; }
.ratio-val{ font-size:20px; font-weight:700; letter-spacing:-0.4px; line-height:1; }
.ratio-delta{ font-size:12px; font-weight:600; padding:3px 8px; border-radius:5px; line-height:1; }
.ratio-delta.up{ color:var(--green); background:color-mix(in srgb, var(--green) 15%, transparent); }
.ratio-delta.down{ color:var(--red); background:color-mix(in srgb, var(--red) 15%, transparent); }
.ratio-charts{ display:grid; grid-template-columns:repeat(3,1fr); gap:9px; }

/* theme switch + comparación */
.theme-seg{ display:inline-flex; border:1px solid var(--border-2); border-radius:2px; overflow:hidden; margin-right:4px; }
.theme-seg button{ font-family:inherit; font-size:11px; color:var(--text-2); background:var(--panel); border:none; border-left:1px solid var(--border); width:26px; height:26px; cursor:pointer; }
.theme-seg button:first-child{ border-left:none; }
.theme-seg button:hover{ color:var(--text); }
.theme-seg button.on{ background:var(--seg-on); color:var(--text); }
.cmp{ display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--text-2);
  border:1px solid var(--border-2); border-radius:2px; padding:5px 11px; }
.cmp b{ color:var(--text); font-weight:600; font-family:'Roboto Mono',monospace; }
.cmp-dot{ width:9px; height:9px; border-radius:2px; }
.cmp-dot.actual{ background:var(--green); }
.cmp-dot.base{ background:var(--text-2); opacity:.55; }
.cmp-sep{ color:var(--faint); margin:0 3px; }

/* PANEL */
.panel{ background:var(--panel); border:1px solid var(--border); border-radius:2px; display:flex; flex-direction:column; }
.panel:hover{ border-color:var(--border-2); }
.panel-head{ display:flex; align-items:baseline; gap:8px; padding:7px 11px 5px; }
.panel-title{ font-size:12px; font-weight:600; }
.panel-role{ margin-left:auto; font-size:9px; color:var(--faint); text-transform:uppercase; letter-spacing:.7px; font-weight:600; }
.panel-body{ padding:2px 11px 10px; }
.ts-canvas{ position:relative; height:124px; }
.legend{ width:100%; border-collapse:collapse; margin-top:7px; }
.legend th{ font-size:10px; font-weight:500; color:var(--text-2); text-align:right; padding:3px 6px 4px; border-bottom:1px solid var(--border); }
.legend th:first-child{ text-align:left; }
.legend td{ font-size:11px; text-align:right; padding:4px 6px; color:var(--text); }
.legend td:first-child{ text-align:left; color:var(--text-2); }
.legend .lg-dot{ display:inline-block; margin-right:7px; vertical-align:middle; }

/* TABLE */
.section-h{ font-size:11px; font-weight:600; color:var(--text-2); text-transform:uppercase; letter-spacing:.8px; margin:18px 2px 8px; }
.blotter{ background:var(--panel); border:1px solid var(--border); border-radius:2px; overflow:hidden; }
table.blot{ width:100%; border-collapse:collapse; }
.blot thead th{ font-size:11px; font-weight:500; color:var(--text-2); padding:8px 11px; text-align:right; white-space:nowrap; cursor:pointer; user-select:none; }
.blot thead th.grp{ text-align:center; font-size:10px; letter-spacing:.5px; color:var(--text-2); background:var(--grp); border-bottom:1px solid var(--border); cursor:default; font-weight:600; text-transform:uppercase; }
.blot thead th.grp.sep{ border-left:1px solid var(--border-2); }
.blot thead th.sub{ background:var(--panel-head); border-bottom:1px solid var(--border); }
.blot thead th.sub:first-child{ text-align:left; }
.blot thead th.sub.sep{ border-left:1px solid var(--border); }
.blot thead th .arr{ color:var(--blue); margin-left:4px; font-size:9px; }
.blot tbody td{ padding:9px 11px; text-align:right; font-size:12px; border-bottom:1px solid var(--border); }
.blot tbody td:first-child{ text-align:left; }
.blot tbody td.sep{ border-left:1px solid var(--border); }
.blot tbody tr:last-child td{ border-bottom:none; }
.blot tbody tr:hover td{ background:var(--panel-hover); }
.blot tbody tr.rowsel td{ background:rgba(94,148,242,0.07); }
.blot tbody tr.rowsel td:first-child{ box-shadow:inset 2px 0 0 var(--blue); }
.chan-cell{ font-size:12px; color:var(--text); font-weight:500; }
.chan-cell .cdot{ display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:8px; vertical-align:middle; }
.cell-up{ color:var(--green); } .cell-down{ color:var(--red); } .cell-neutral{ color:var(--faint); }
.cell-strong{ color:var(--text); } .cell-na{ color:var(--faint); cursor:help; }

@media(max-width:900px){ .ratio-charts{ grid-template-columns:1fr; } }
</style>
</head>
<body>

<div class="topbar">
  <div class="tb-left">
    <span class="tb-icon">▦</span>
    <span class="tb-title">Elasticidades</span>
    <span class="tb-crumb">/ LatAm Performance</span>
  </div>
  <div class="tb-right">
    <span class="tb-time" id="tb-time">—</span>
  </div>
</div>

<div class="varbar">
  <div class="var"><span class="var-l">País</span>
    <div class="seg" id="seg-pais">
      <button data-v="TOTAL" class="on"><span class="bdot" style="background:#7c3aed"></span>Total</button>
      <button data-v="AR"><span class="bdot" style="background:#2563eb"></span>AR</button>
      <button data-v="CL"><span class="bdot" style="background:#e11d48"></span>CL</button>
      <button data-v="UY"><span class="bdot" style="background:#16a34a"></span>UY</button>
    </div>
  </div>
  <div class="var"><span class="var-l">Canal</span>
    <div class="seg" id="seg-chan">
      <button data-v="total" class="on"><span class="bdot" style="background:#7c3aed"></span>Total</button>
      <button data-v="google"><span class="bdot" style="background:#ca8a04"></span>Google</button>
      <button data-v="meta"><span class="bdot" style="background:#e11d48"></span>Meta</button>
      <button data-v="organic"><span class="bdot" style="background:#16a34a"></span>Orgánico</button>
      <button data-v="others"><span class="bdot" style="background:#5a6072"></span>Otros</button>
    </div>
  </div>
  <div class="var"><span class="var-l">Semana</span>
    <div class="wk-wrap">
      <select class="wk-sel" id="wk-from"></select>
      <span class="wk-arrow">→</span>
      <select class="wk-sel" id="wk-to"></select>
    </div>
  </div>
  <div class="varspacer"></div>
</div>

<div class="wrap">
  <div id="grid"></div>

  <div class="section-h" id="blot-title">Matriz de elasticidades por canal</div>
  <div class="blotter">
    <table class="blot"><thead id="blot-thead"></thead><tbody id="blot-body"></tbody></table>
  </div>
</div>

<script>
const DATA = /*__BUILD_DATA__*/{};

const PAIS_META = {
  TOTAL:{name:'Total LatAm', accent:'#8b7cf5'},
  AR:{name:'Argentina', accent:'#3b82f6'},
  CL:{name:'Chile', accent:'#f43f5e'},
  UY:{name:'Uruguay', accent:'#22c55e'},
};
const CHAN_NAME  = { total:'Total', google:'Google', meta:'Meta', organic:'Orgánico', others:'Otros' };
const CHAN_COLOR = { total:'#7c3aed', google:'#ca8a04', meta:'#e11d48', organic:'#16a34a', others:'#5a6072' };
const CHAN_SPEND = { total:true, google:true, meta:true, organic:false, others:false }; // orgánico/otros no tienen inversión

// Colores semánticos por métrica base (mismo color en todas las filas)
const COL = { spend:'#fbbf24', purch:'#3b82f6', ses:'#8b7cf5' };

// 3 filas: numerador / denominador / cálculo (en ese orden)
const ROWS = [
  { key:'cpa', name:'CPA',
    num:{key:'spend', name:'Spend',     color:COL.spend, axis:'$', fmt:fmtMoney},
    den:{key:'purch', name:'Purchases', color:COL.purch, axis:'',  fmt:fmtCount},
    calc:{name:'CPA', color:'#ffb020', axis:'$', fmt:fmtMoneyRate, inverse:true} },
  { key:'cps', name:'CPS',
    num:{key:'spend', name:'Spend',     color:COL.spend, axis:'$', fmt:fmtMoney},
    den:{key:'ses',   name:'Sesiones',  color:COL.ses,   axis:'',  fmt:fmtCount},
    calc:{name:'CPS', color:'#ffb020', axis:'$', fmt:fmtMoneyRate, inverse:true} },
  { key:'cvr', name:'CVR',
    num:{key:'purch', name:'Purchases', color:COL.purch, axis:'',  fmt:fmtCount},
    den:{key:'ses',   name:'Sesiones',  color:COL.ses,   axis:'',  fmt:fmtCount},
    calc:{name:'CVR', color:'#22d3ee', axis:'%', fmt:fmtPctVal, inverse:false} },
];

let PAIS='TOTAL', CHAN='total', WFROM=0, WTO=0, THEME='mid';
let charts={};

// ── helpers ──
// Ventanas (mismas que build.py): actual = últimas N, base = M previas. Cambiar acá si se redefinen.
const ACTUAL_WEEKS=2, BASE_WEEKS=4;
function windows(n){
  const a1=n-1, a0=Math.max(0, n-ACTUAL_WEEKS);
  const b1=Math.max(0, a0-1), b0=Math.max(0, b1-(BASE_WEEKS-1));
  return { base:[b0,b1], actual:[a0,a1] };
}
function chanSeries(evo, chan){
  if(chan==='google') return { spend:evo.spend_google,
    purch:evo.purch_search.map((v,i)=>(v||0)+(evo.purch_pmax[i]||0)),
    ses:evo.ses_search.map((v,i)=>(v||0)+(evo.ses_pmax[i]||0)) };
  if(chan==='meta') return { spend:evo.spend_meta, purch:evo.purch_meta, ses:evo.ses_meta };
  if(chan==='organic') return { spend:evo.purch_organic.map(()=>null), purch:evo.purch_organic, ses:evo.ses_organic };
  if(chan==='others')  return { spend:evo.purch_others.map(()=>null),  purch:evo.purch_others,  ses:evo.ses_others };
  return { spend:evo.spend_total, purch:evo.purch_total, ses:evo.ses_total };
}
function metricSeries(cs, key){
  switch(key){
    case 'spend': return cs.spend; case 'purch': return cs.purch; case 'ses': return cs.ses;
    case 'cpa': return cs.spend.map((s,i)=> cs.purch[i]>0 ? s/cs.purch[i] : null);
    case 'cps': return cs.spend.map((s,i)=> cs.ses[i]>0 ? s/cs.ses[i] : null);
    case 'cvr': return cs.purch.map((p,i)=> cs.ses[i]>0 ? p/cs.ses[i]*100 : null);
  }
}
function sliceCS(cs){ return { spend:cs.spend.slice(WFROM,WTO+1), purch:cs.purch.slice(WFROM,WTO+1), ses:cs.ses.slice(WFROM,WTO+1) }; }
function avgIdx(arr,[a,b]){ const xs=arr.slice(a,b+1).filter(v=>v!=null); return xs.length? xs.reduce((s,v)=>s+v,0)/xs.length : 0; }
function phaseValue(cs, key, idx, phase){
  const w=idx[phase], s=avgIdx(cs.spend,w), p=avgIdx(cs.purch,w), se=avgIdx(cs.ses,w);
  switch(key){ case 'spend':return s; case 'purch':return p; case 'ses':return se;
    case 'cpa':return p>0?s/p:null; case 'cps':return se>0?s/se:null; case 'cvr':return se>0?p/se*100:null; }
}
function seriesStats(series){ const xs=series.filter(v=>v!=null&&isFinite(v));
  let last=null; for(let i=series.length-1;i>=0;i--){ if(series[i]!=null){last=series[i];break;} }
  if(!xs.length) return {last:null,min:null,max:null,mean:null};
  return { last, min:Math.min(...xs), max:Math.max(...xs), mean:xs.reduce((a,b)=>a+b,0)/xs.length }; }

// ── formatters ──
function fmtMoney(v){ if(v==null) return '—'; if(v>=1000) return '$'+(v/1000).toFixed(1)+'K'; return '$'+Math.round(v).toLocaleString('en-US'); }
function fmtMoneyRate(v){ if(v==null) return '—'; const a=Math.abs(v); return '$'+v.toFixed(a>=1?2:3); }
function fmtPctVal(v){ if(v==null) return '—'; return v.toFixed(2)+'%'; }
function fmtCount(v){ if(v==null) return '—'; if(v>=1e6) return (v/1e6).toFixed(1)+'M'; if(v>=1000) return (v/1000).toFixed(1)+'K'; return Math.round(v).toLocaleString('en-US'); }
function fmtDelta(v){ if(v==null) return '—'; return (v>=0?'+':'−')+Math.abs(v).toFixed(1)+'%'; }

// ── chart styling ──
Chart.defaults.font.family="'Roboto Mono', monospace"; Chart.defaults.font.size=10; Chart.defaults.color='#9296a0';
function hexA(hex,a){ const n=parseInt(hex.slice(1),16); return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`; }
function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function niceAxis(values, pad, zeroBase){
  const vs=values.filter(v=>v!=null&&isFinite(v)); if(!vs.length) return {min:0,max:1,step:1};
  let mn=Math.min(...vs), mx=Math.max(...vs); const allPos=mn>=0; const range=(mx-mn)||Math.abs(mx)||1;
  mx+=range*pad; mn-=range*pad; if(zeroBase||(allPos&&mn<0)) mn=0;
  const rawStep=(mx-mn)/4, mag=Math.pow(10,Math.floor(Math.log10(rawStep))), norm=rawStep/mag;
  const step=(norm<1.5?1:norm<3?2:norm<7?5:10)*mag;
  return { min:Math.floor(mn/step)*step, max:Math.ceil(mx/step)*step, step };
}
function tickFmt(v, axis){ return axis==='$' ? (v>=1000?'$'+(v/1000)+'K':'$'+(v<10?(v%1?v.toFixed(1):v):Math.round(v)))
  : axis==='%' ? v.toFixed(1)+'%' : (v>=1000?(v/1000).toFixed(0)+'K':Math.round(v)); }

function periodPlugin(b0,b1,a0,a1, th){
  return { id:'period'+Math.random(),
    beforeDatasetsDraw(chart){
      const {ctx,chartArea,scales}=chart, x=scales.x; if(!chartArea||!x) return;
      const bw=x.getPixelForValue(1)-x.getPixelForValue(0);
      const edge=(i0,i1)=>({l:x.getPixelForValue(i0)-bw/2, r:x.getPixelForValue(i1)+bw/2});
      const B=edge(b0,b1), A=edge(a0,a1);
      ctx.save();
      // Base = banda neutra · Actual = banda verde. Sin texto: la leyenda vive en la barra de filtros.
      ctx.fillStyle=th.base;   ctx.fillRect(B.l,chartArea.top,B.r-B.l,chartArea.height);
      ctx.fillStyle=th.actual; ctx.fillRect(A.l,chartArea.top,A.r-A.l,chartArea.height);
      ctx.setLineDash([3,3]); ctx.lineWidth=1; ctx.strokeStyle=th.divider;
      ctx.beginPath(); ctx.moveTo(B.l,chartArea.top); ctx.lineTo(B.l,chartArea.bottom); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(A.l,chartArea.top); ctx.lineTo(A.l,chartArea.bottom); ctx.stroke();
      ctx.restore();
    }
  };
}

// ── render grid 3×3 ──
function makeChart(id, labels, data, spec, isLine, idx){
  const ctx=document.getElementById(id).getContext('2d'), col=spec.color;
  const tick=cssVar('--tick'), grid=cssVar('--grid'), ttBg=cssVar('--tooltip-bg'), ttTx=cssVar('--tooltip-tx');
  const th={ base:cssVar('--band-base'), actual:cssVar('--band-actual'), divider:cssVar('--divider') };
  const ds = isLine
    ? { type:'line', data, borderColor:col, borderWidth:2.4, pointRadius:2.2, pointHoverRadius:4.5, pointBackgroundColor:col, pointBorderWidth:0, tension:0.3, spanGaps:true, fill:true,
        backgroundColor:(c)=>{ const a=c.chart.chartArea; if(!a) return 'transparent'; const g=c.chart.ctx.createLinearGradient(0,a.top,0,a.bottom); g.addColorStop(0,hexA(col,0.16)); g.addColorStop(1,hexA(col,0)); return g; } }
    : { type:'bar', data, backgroundColor:hexA(col,0.82), hoverBackgroundColor:col, borderRadius:2, categoryPercentage:0.8, barPercentage:0.92 };
  const ax = isLine ? niceAxis(data,0.15,false) : niceAxis(data,0.05,true);
  charts[id]=new Chart(ctx,{ type:isLine?'line':'bar', data:{labels, datasets:[ds]},
    plugins:[periodPlugin(idx.base[0],idx.base[1],idx.actual[0],idx.actual[1], th)],
    options:{ responsive:true, maintainAspectRatio:false, animation:{duration:200},
      interaction:{mode:'index',intersect:false},
      plugins:{ legend:{display:false},
        tooltip:{ backgroundColor:ttBg, borderColor:'rgba(128,128,140,0.3)', borderWidth:1, padding:8,
          titleColor:ttTx, bodyColor:ttTx, displayColors:false,
          callbacks:{ label:(t)=> '  '+spec.name+': '+spec.fmt(t.raw) } } },
      scales:{ x:{ grid:{display:false}, border:{display:false}, ticks:{color:tick, maxRotation:0,autoSkip:true,maxTicksLimit:7} },
        y:{ min:ax.min, max:ax.max, grid:{color:grid}, border:{display:false},
            ticks:{ color:tick, stepSize:ax.step, callback:(v)=>tickFmt(v,spec.axis) } } } } });
}

function panelHTML(id, name, role, color, fmt, series, isLine){
  const st=seriesStats(series);
  const dot=isLine?'width:14px;height:3px;border-radius:1px':'width:9px;height:9px;border-radius:2px';
  return `<div class="panel">
    <div class="panel-head"><span class="panel-title">${name}</span><span class="panel-role">${role}</span></div>
    <div class="panel-body">
      <div class="ts-canvas"><canvas id="${id}"></canvas></div>
      <table class="legend"><thead><tr><th>Serie</th><th>Último</th><th>Mín</th><th>Máx</th><th>Prom</th></tr></thead>
      <tbody><tr>
        <td><span class="lg-dot" style="background:${color};${dot}"></span>${name}</td>
        <td class="mono">${fmt(st.last)}</td><td class="mono">${fmt(st.min)}</td>
        <td class="mono">${fmt(st.max)}</td><td class="mono">${fmt(st.mean)}</td>
      </tr></tbody></table>
    </div></div>`;
}

function renderGrid(){
  const evo=DATA[PAIS].evo;
  const cs=sliceCS(chanSeries(evo,CHAN));
  const wk=evo.weeks.slice(WFROM,WTO+1);
  const idx=windows(wk.length);
  const C={ spend:cssVar('--c-spend'), purch:cssVar('--c-purch'), ses:cssVar('--c-ses') };
  const LC={ cpa:cssVar('--c-money'), cps:cssVar('--c-money'), cvr:cssVar('--c-pct') };
  const host=document.getElementById('grid'); host.innerHTML='';

  const rowsToShow = CHAN_SPEND[CHAN] ? ROWS : ROWS.filter(R=>R.key==='cvr');
  rowsToShow.forEach(R=>{
    const numS=metricSeries(cs,R.num.key), denS=metricSeries(cs,R.den.key), calcS=metricSeries(cs,R.key);
    const numC=C[R.num.key], denC=C[R.den.key], calcC=LC[R.key];
    const base=phaseValue(cs,R.key,idx,'base'), actual=phaseValue(cs,R.key,idx,'actual');
    const pct=(base&&base!==0)?(actual-base)/base*100:null;
    const good=pct==null?null:(R.calc.inverse?pct<=0:pct>=0);
    const valColor=good==null?'var(--text)':(good?'var(--green)':'var(--red)');

    const block=document.createElement('div'); block.className='ratio-row';
    block.innerHTML=`
      <div class="ratio-head">
        <span class="ratio-name">${R.name}</span>
        <span class="ratio-formula">${R.num.name} ÷ ${R.den.name}</span>
        <span class="ratio-kpi-group">
          <span class="ratio-val mono" style="color:${valColor}">${R.calc.fmt(actual)}</span>
          ${pct==null?'':`<span class="ratio-delta ${good?'up':'down'} mono">${pct>=0?'▲':'▼'} ${fmtDelta(pct)}</span>`}
        </span>
      </div>
      <div class="ratio-charts">
        ${panelHTML(R.key+'-num',  R.num.name, 'Numerador',   numC,  R.num.fmt,  numS,  false)}
        ${panelHTML(R.key+'-den',  R.den.name, 'Denominador', denC,  R.den.fmt,  denS,  false)}
        ${panelHTML(R.key+'-calc', R.calc.name,'Cálculo',     calcC, R.calc.fmt, calcS, true)}
      </div>`;
    host.appendChild(block);

    makeChart(R.key+'-num',  wk, numS,  {name:R.num.name, axis:R.num.axis, fmt:R.num.fmt, color:numC},  false, idx);
    makeChart(R.key+'-den',  wk, denS,  {name:R.den.name, axis:R.den.axis, fmt:R.den.fmt, color:denC},  false, idx);
    makeChart(R.key+'-calc', wk, calcS, {name:R.calc.name,axis:R.calc.axis,fmt:R.calc.fmt,color:calcC}, true,  idx);
  });
}

// ── blotter (elasticidades del país elegido · sobre el rango visible) ──
let sortKey='', sortDir=-1;
function rangeElas(cs, idx){
  const A=(arr,w)=>avgIdx(arr,w);
  const sB=A(cs.spend,idx.base), sA=A(cs.spend,idx.actual);
  const pB=A(cs.purch,idx.base), pA=A(cs.purch,idx.actual);
  const seB=A(cs.ses,idx.base), seA=A(cs.ses,idx.actual);
  const pc=(b,a)=> b? (a-b)/b*100 : 0;
  const spend_pct=pc(sB,sA), purch_pct=pc(pB,pA), ses_pct=pc(seB,seA);
  return { spend_pct, purch_pct, ses_pct,
    e_purch: spend_pct? purch_pct/spend_pct : null,
    e_ses:   spend_pct? ses_pct/spend_pct : null,
    mc_purch: (pA-pB)? (sA-sB)/(pA-pB) : null };
}
function gateReason(sp, rp){
  if(sp==null) return 'Canal sin inversión — elasticidad no aplica';
  if(sp>0&&rp>0) return null;
  const w=[]; if(sp<=0) w.push('spend no subió'); if(rp<=0) w.push('resultado no subió');
  return 'Aplica solo con spend ↑ y resultado ↑ — '+w.join(' · '); }

function renderBlotter(){
  const sub=[
    {key:'spend_pct',label:'Δ%',sep:true},
    {key:'purch_pct',label:'Δ%',sep:true},
    {key:'e_purch',label:'Elast.'},
    {key:'mc_purch',label:'$/compra'},
    {key:'ses_pct',label:'Δ%',sep:true},
    {key:'e_ses',label:'Elast.'},
  ];
  const arr=(k)=> sortKey===k?`<span class="arr">${sortDir<0?'▼':'▲'}</span>`:'';
  document.getElementById('blot-thead').innerHTML=`
    <tr>
      <th class="grp" rowspan="2" style="text-align:left">Canal</th>
      <th class="grp sep">Spend</th>
      <th class="grp sep" colspan="3">Purchases</th>
      <th class="grp sep" colspan="2">Sesiones</th>
    </tr>
    <tr>${sub.map(c=>`<th data-key="${c.key}" class="sub ${c.sep?'sep':''}">${c.label}${arr(c.key)}</th>`).join('')}</tr>`;
  document.querySelectorAll('#blot-thead th[data-key]').forEach(th=>{ const k=th.dataset.key;
    th.onclick=()=>{ if(sortKey===k) sortDir*=-1; else {sortKey=k;sortDir=-1;} renderBlotter(); }; });

  const evo=DATA[PAIS].evo;
  let rows=['total','google','meta','organic','others'].map(ch=>{
    const cs=sliceCS(chanSeries(evo,ch)); const idx=windows(cs.purch.length);
    const e=rangeElas(cs,idx);
    if(!CHAN_SPEND[ch]){ e.spend_pct=null; e.e_purch=null; e.e_ses=null; e.mc_purch=null; }
    return { chan:ch, ...e };
  });
  if(sortKey) rows.sort((a,b)=>{ const av=a[sortKey]??-1e9, bv=b[sortKey]??-1e9; return (av-bv)*sortDir; });

  const pct=(v,inv,sep)=>{ const s=sep?' sep':''; if(v==null) return `<td class="mono cell-neutral${s}">—</td>`;
    const good=inv?v<=0:v>=0; return `<td class="mono ${good?'cell-up':'cell-down'}${s}">${v>=0?'+':'−'}${Math.abs(v).toFixed(1)}%</td>`; };
  const eC=(v,sp,rp,sep)=>{ const s=sep?' sep':''; const why=gateReason(sp,rp);
    if(why) return `<td class="mono cell-na${s}" title="${why}">n/a</td>`;
    if(v==null) return `<td class="mono cell-neutral${s}">—</td>`;
    return `<td class="mono cell-strong${s}">${Math.abs(v)>10?'>10':v.toFixed(2)}</td>`; };
  const mcC=(v,sp,rp)=>{ const why=gateReason(sp,rp); if(why) return `<td class="mono cell-na" title="${why}">n/a</td>`;
    if(v==null) return '<td class="mono cell-neutral">—</td>'; const a=Math.abs(v),d=a>=10?0:a>=1?2:3; return `<td class="mono cell-strong">$${a.toFixed(d)}</td>`; };

  document.getElementById('blot-body').innerHTML=rows.map(r=>`<tr class="${r.chan===CHAN?'rowsel':''}">
    <td class="chan-cell"><span class="cdot" style="background:${CHAN_COLOR[r.chan]}"></span>${CHAN_NAME[r.chan]}</td>
    ${pct(r.spend_pct,true,true)}${pct(r.purch_pct,false,true)}
    ${eC(r.e_purch,r.spend_pct,r.purch_pct,false)}${mcC(r.mc_purch,r.spend_pct,r.purch_pct)}
    ${pct(r.ses_pct,false,true)}${eC(r.e_ses,r.spend_pct,r.ses_pct,false)}
  </tr>`).join('');
}

// ── filtros ──
function bindSeg(id,onPick){ document.getElementById(id).querySelectorAll('button').forEach(btn=>{
  btn.onclick=()=>{ document.getElementById(id).querySelectorAll('button').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on'); onPick(btn.dataset.v); }; }); }

function refresh(){
  Object.values(charts).forEach(c=>{try{c.destroy();}catch(e){}}); charts={};
  const evo=DATA[PAIS].evo, wk=evo.weeks.slice(WFROM,WTO+1), idx=windows(wk.length);
  document.getElementById('blot-title').textContent=`Matriz de elasticidades · ${PAIS_META[PAIS].name} · ${wk[idx.actual[0]]}–${wk[idx.actual[1]]} vs ${wk[idx.base[0]]}–${wk[idx.base[1]]}`;
  renderGrid(); renderBlotter();
}

// ── init ──
(function(){
  const weeks=DATA.TOTAL.evo.weeks, n=weeks.length;
  WFROM=0; WTO=n-1;
  const fromSel=document.getElementById('wk-from'), toSel=document.getElementById('wk-to');
  weeks.forEach((w,i)=>{ fromSel.add(new Option(w,i)); toSel.add(new Option(w,i)); });
  fromSel.value=WFROM; toSel.value=WTO;
  fromSel.onchange=()=>{ let f=+fromSel.value; if(f>WTO-1) f=Math.max(0,WTO-1); WFROM=f; fromSel.value=f; refresh(); };
  toSel.onchange=()=>{ let t=+toSel.value; if(t<WFROM+1) t=Math.min(n-1,WFROM+1); WTO=t; toSel.value=t; refresh(); };

  const now=new Date(), mm=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  document.getElementById('tb-time').textContent=`${now.getDate()} ${mm[now.getMonth()]} ${now.getFullYear()}`;

  bindSeg('seg-pais', v=>{ PAIS=v; refresh(); });
  bindSeg('seg-chan', v=>{ CHAN=v; refresh(); });
  refresh();
})();
</script>
